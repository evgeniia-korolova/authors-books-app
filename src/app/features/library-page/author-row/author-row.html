<div
  role="row"
  class="grid grid-cols-[2fr_1fr_minmax(40px,auto)_minmax(40px,auto)_minmax(40px,auto)] gap-2 border-b py-2 pr-2 items-center text-base sm:text-lg lg:text-2xl"
>
  <div role="cell">{{ author().firstName | titlecase }} {{ author().lastName | titlecase }}</div>
  <div role="cell">{{ author().books.length }}</div>
  <button
    class="text-blue-600 cursor-pointer hover:text-blue-400 transition text-base md:text-lg lg:text-xl px-2"
    (click)="onEdit(author())"
    aria-haspopup="dialog"
  >
    @if (responsiveService.smallWidth()) {
    <mat-icon>edit</mat-icon>
    } @else { Edit }
  </button>
  <button
    class="text-red-600 cursor-pointer hover:text-red-400 transition text-base md:text-lg lg:text-xl px-2"
    (click)="onRemove(author())"
  >
    @if (responsiveService.smallWidth()) {
    <mat-icon>delete</mat-icon>
    } @else { Delete }
  </button>
  <button
    class="text-green-600 cursor-pointer hover:text-green-400 transition text-base md:text-lg lg:text-xl px-2"
    [routerLink]="['/author', author().id]"
  >
    @if (responsiveService.smallWidth()) {
    <mat-icon>info</mat-icon>
    } @else { Details }
  </button>
</div>
