<div class="grid grid-cols-[2fr_1fr_minmax(80px,auto)_minmax(80px,auto)_minmax(80px,auto)] gap-2 border-b py-2 items-center">
  <div>{{author().firstName}} {{author().lastName}}</div>
  <div>{{author().books.length}}</div>
  <button class="text-blue-600">Edit</button>
  <button class="text-red-600" (click)="onRemove(author())">Delete</button>
  <button class="text-green-600">Details</button>
</div>
