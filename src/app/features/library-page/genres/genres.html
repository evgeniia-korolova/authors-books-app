<section class="flex w-full px-1 lg:px-5 relative">
  <aside
    class="flex flex-col px-1 md:px-4 lg:px-4 transform transition-transform duration-300 ease-in-out sidebar z-10 h-full absolute left-0 top-0 w-full md:w-full lg:static lg:w-1/4"
    [class.-translate-x-full]="
      (responsiveService.smallWidth() || responsiveService.mediumWidth()) &&
      !sidebarService.opened()
    "
    [class.translate-x-0]="
      (responsiveService.smallWidth() || responsiveService.mediumWidth()) && sidebarService.opened()
    "
    [class.translate-x-0]="responsiveService.largeWidth()"
  >
    <h2 class="text-lg font-bold mb-4">Genres</h2>
    <ul class="overflow-y-auto">
      @for (genre of libraryStore.genres(); track genre.id) {
      <li
        role="button"
        tabindex="0"
        class="py-2 cursor-pointer hover:underline"
        aria-label="Select genre {{ genre.title }}"
        (click)="onSelectGenre(genre.title)"
        (keydown.enter)="onSelectGenre(genre.title)"
        (keydown.space)="onSelectGenre(genre.title)"
        [class.selected]="libraryStore.selectedGenre() === genre.title"
      >
        {{ genre.title | titlecase }}
      </li>
      } @empty {
      <li>No genres yet</li>
      }
    </ul>
    <button
      matButton="filled"
      (click)="openAddGenreDialog()"
      aria-haspopup="dialog"
      aria-label="Add new genre"
      class="text-base self-start mt-auto"
    >
      Add Genre
    </button>
  </aside>

  <article class="w-3/4 flex-1 min-w-0 px-6">
    <div class="mb-4 flex gap-5">
      <input
        type="text"
        placeholder="Search books..."
        class="w-3/4 border px-3 py-2"
        [formControl]="searchControl"
        (input)="updateSearchTerm()"
        (keydown.escape)="clearSearch()"
      />
      <button
        type="button"
        class="font-extrabold cursor-pointer"
        aria-label="Clear search"
        (click)="clearSearch()"
      >
        ✕
      </button>
    </div>

    <h2 class="text-lg font-bold mb-4">Books</h2>
    <app-genres-books-list />
  </article>
</section>
