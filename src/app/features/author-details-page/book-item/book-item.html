@if (book(); as book) {
<li class="flex items-center justify-between border-b py-3">
  <div>
    <h3 class="text-base sm:text-lg font-semibold">{{ book.title }}</h3>
    <p class="text-sm sm:text-base">
        {{ book.genre.title }} · {{ book.pages }} pages
    </p>
  </div>
  <div class="flex gap-2">
    <button class="text-sm sm:text-base font-medium underline cursor-pointer" (click)="onEdit()" aria-haspopup="dialog">Edit</button>
    <button class="text-sm sm:text-base font-medium underline cursor-pointer" (click)="onDelete()">Delete</button>
  </div>
</li>
}
