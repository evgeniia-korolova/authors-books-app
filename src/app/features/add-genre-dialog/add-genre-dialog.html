<h2 mat-dialog-title>Add Genre</h2>
<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="fill" class="w-full">
      <mat-label>Genre</mat-label>
      <input matInput formControlName="title" />
    </mat-form-field>
  </form>
</mat-dialog-content>
@if (form.hasError('duplicateGenre')) {
<mat-error class="text-center">This genre already exists</mat-error>
}

<mat-dialog-actions align="end">
  <button matButton (click)="cancel()">Cancel</button>
  <button matButton="filled" [disabled]="form.invalid" (click)="save()">Save</button>
</mat-dialog-actions>
